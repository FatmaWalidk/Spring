spring.application.name=taskmanager

# Active profile is chosen at runtime, e.g.:
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
#   java -jar app.jar --spring.profiles.active=prod
spring.profiles.active=dev

# ---- JPA ----
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
# Never hardcode the real secret - export JWT_SECRET as an environment
# variable (must be a Base64-encoded string, 256+ bits for HS256).
jwt.secret=${JWT_SECRET}
jwt.access-expiration=900000
jwt.refresh-expiration=604800000

# ---- File storage ----
app.upload-dir=${UPLOAD_DIR:./uploads}

# ---- Actuator (cache stats, health) ----
management.endpoints.web.exposure.include=health,caches
