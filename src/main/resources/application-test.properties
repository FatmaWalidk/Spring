# In-memory H2 so tests never touch a real database. Add
# com.h2database:h2 (test scope) to pom.xml to use this profile.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLW9ubHktZG8tbm90LXVzZQ==
jwt.access-expiration=900000
jwt.refresh-expiration=604800000

app.upload-dir=./test-uploads
