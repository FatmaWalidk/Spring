# Production - every value comes from the environment, nothing is
# hardcoded. ddl-auto=validate: the schema is managed by migrations
# (Flyway/Liquibase), Hibernate only checks it matches - it never
# auto-generates or alters tables in production.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

logging.level.root=WARN
logging.level.com.fatma.taskmanger=INFO
